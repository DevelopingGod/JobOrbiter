name: Semgrep
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  scan:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run semgrep
        run: semgrep scan --config auto --error .
